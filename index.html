<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000814">
<title>Ondazul</title>
<link rel="icon" type="image/png" href="assets/icon_android.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-top: #000814;
  --bg-bottom: #001D3D;
  --card: #001F3F;
  --azul: #3B82F6;
  --azul-neon: #38BDF8;
  --texto: #FFFFFF;
  --texto-sec: #BFDBFE;
  --texto-mudo: #64748B;
  --vermelho: #EF4444;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--texto);
  user-select: none;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 500px;
  margin: 0 auto;
}

/* ============ HEADER ============ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(56, 189, 248, 0.1);
}

.header h1 {
  font-size: 1.1rem;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--azul-neon));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--texto-sec);
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  font-size: 1.1rem;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover, .icon-btn:active {
  background: rgba(56, 189, 248, 0.15);
  color: var(--azul-neon);
}

/* ============ PLAYER ============ */
.player {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.titulo {
  font-size: 1.05rem;
  font-weight: 700;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.artista {
  font-size: 0.85rem;
  color: var(--texto-sec);
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: -6px;
}

.progresso-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.progresso {
  width: 100%;
  height: 20px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.progresso::-webkit-slider-runnable-track {
  height: 4px;
  background: #1E3A5F;
  border-radius: 999px;
}

.progresso::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  background: var(--azul-neon);
  border-radius: 50%;
  margin-top: -5px;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
}

.progresso::-moz-range-track {
  height: 4px;
  background: #1E3A5F;
  border-radius: 999px;
}

.progresso::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: var(--azul-neon);
  border-radius: 50%;
  border: none;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
}

.tempos {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--texto-mudo);
}

.controles {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.controles button {
  background: transparent;
  border: none;
  color: var(--texto);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  font-size: 1.3rem;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.controles button:hover, .controles button:active {
  background: rgba(56, 189, 248, 0.15);
  color: var(--azul-neon);
}

.controles .btn-play {
  background: var(--azul);
  color: #fff;
  width: 56px;
  height: 56px;
  font-size: 1.6rem;
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.5);
}

.controles .btn-play:hover, .controles .btn-play:active {
  background: var(--azul-neon);
  transform: scale(1.05);
}

.controles .ativo {
  color: var(--azul-neon) !important;
}

/* ============ VOLUME ============ */
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
}

.volume-wrap input {
  flex: 1;
  height: 16px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.volume-wrap input::-webkit-slider-runnable-track {
  height: 3px;
  background: #1E3A5F;
  border-radius: 999px;
}

.volume-wrap input::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  background: var(--azul-neon);
  border-radius: 50%;
  margin-top: -4.5px;
}

.volume-wrap input::-moz-range-track {
  height: 3px;
  background: #1E3A5F;
  border-radius: 999px;
}

.volume-wrap input::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: var(--azul-neon);
  border-radius: 50%;
  border: none;
}

/* ============ LISTA ============ */
.lista-painel {
  flex: 1;
  background: rgba(0, 31, 63, 0.6);
  border-radius: 16px 16px 0 0;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}

.busca-row {
  display: flex;
  gap: 8px;
}

.busca-row input, .busca-row select {
  flex: 1;
  background: var(--card);
  border: 1px solid #1E3A5F;
  border-radius: 8px;
  color: var(--texto);
  padding: 8px 12px;
  font-size: 0.85rem;
  outline: none;
}

.busca-row input:focus, .busca-row select:focus {
  border-color: var(--azul-neon);
}

.busca-row input::placeholder {
  color: var(--texto-mudo);
}

.busca-row select option {
  background: var(--card);
}

/* Chips de playlist */
.playlist-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.playlist-tabs::-webkit-scrollbar {
  display: none;
}

.chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--card);
  color: var(--texto-sec);
  font-size: 0.75rem;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}

.chip.ativo {
  background: var(--azul);
  color: var(--texto);
}

.chip:hover {
  background: rgba(56, 189, 248, 0.2);
}

/* Lista */
.lista {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--azul) transparent;
}

.lista::-webkit-scrollbar {
  width: 6px;
}

.lista::-webkit-scrollbar-thumb {
  background: var(--azul);
  border-radius: 999px;
}

.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}

.item:hover {
  background: rgba(56, 189, 248, 0.1);
}

.item.ativo {
  background: rgba(56, 189, 248, 0.25);
  border-left-color: var(--azul-neon);
}

.item-num {
  width: 26px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--texto-mudo);
  font-family: monospace;
  flex-shrink: 0;
}

.item.ativo .item-num {
  color: var(--azul-neon);
  font-weight: 700;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-titulo {
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--texto);
}

.item.ativo .item-titulo {
  font-weight: 700;
  color: var(--azul-neon);
}

.item-artista {
  font-size: 0.7rem;
  color: var(--texto-mudo);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item.ativo .item-artista {
  color: var(--texto-sec);
}

.item-dur {
  font-size: 0.7rem;
  color: var(--texto-mudo);
  flex-shrink: 0;
}

.item-acoes {
  display: flex;
  gap: 0;
  flex-shrink: 0;
}

.item-acoes button {
  background: transparent;
  border: none;
  color: var(--texto-mudo);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.item-acoes button:hover {
  color: var(--azul-neon);
  background: rgba(56, 189, 248, 0.15);
}

.item-acoes button.fav {
  color: var(--vermelho);
}

/* ============ EMPTY STATE ============ */
.vazio {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
  text-align: center;
  color: var(--texto-sec);
}

.vazio .emoji {
  font-size: 3rem;
  margin-bottom: 12px;
}

.vazio h3 {
  font-size: 1rem;
  margin-bottom: 8px;
  color: var(--texto);
}

.vazio p {
  font-size: 0.85rem;
  color: var(--texto-mudo);
  margin-bottom: 20px;
}

.vazio button {
  background: var(--azul);
  color: var(--texto);
  border: none;
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.vazio button:hover {
  background: var(--azul-neon);
  transform: translateY(-2px);
}

/* ============ DRAG & DROP OVERLAY ============ */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 8, 20, 0.9);
  backdrop-filter: blur(8px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  color: var(--azul-neon);
  font-size: 1.5rem;
  font-weight: 700;
}

.drop-overlay.visivel {
  display: flex;
}

.drop-overlay .emoji {
  font-size: 5rem;
  margin-bottom: 20px;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0, 31, 63, 0.95);
  border: 1px solid var(--azul-neon);
  color: var(--texto);
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 0.85rem;
  opacity: 0;
  transition: all 0.3s;
  z-index: 10000;
  backdrop-filter: blur(10px);
  max-width: 90vw;
  text-align: center;
}

.toast.visivel {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  padding: 20px;
}

.modal-overlay.visivel {
  display: flex;
}

.modal {
  background: var(--bg-bottom);
  border-radius: 16px;
  padding: 20px;
  max-width: 340px;
  width: 100%;
  border: 1px solid #1E3A5F;
}

.modal h3 {
  font-size: 1rem;
  margin-bottom: 16px;
  color: var(--texto);
}

.modal input {
  width: 100%;
  background: var(--card);
  border: 1px solid #1E3A5F;
  border-radius: 8px;
  color: var(--texto);
  padding: 10px 12px;
  font-size: 0.9rem;
  margin-bottom: 12px;
  outline: none;
}

.modal input:focus {
  border-color: var(--azul-neon);
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.modal-actions button {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

.modal-actions .cancelar {
  background: transparent;
  color: var(--texto-sec);
}

.modal-actions .cancelar:hover {
  background: rgba(56, 189, 248, 0.15);
}

.modal-actions .confirmar {
  background: var(--azul);
  color: var(--texto);
}

.modal-actions .confirmar:hover {
  background: var(--azul-neon);
}

/* ============ RESPONSIVO ============ */
@media (max-width: 600px) {
  .player { padding: 12px; }
  .controles { gap: 8px; }
  .controles .btn-play { width: 52px; height: 52px; }
}

</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>🎵 Ondazul</h1>
    <div class="header-actions">
      <button class="icon-btn" id="btn-adicionar" title="Adicionar músicas">📁</button>
      <button class="icon-btn" id="btn-menu" title="Menu">⋮</button>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <div class="titulo" id="titulo">—</div>
    <div class="artista" id="artista">—</div>

    <div class="progresso-wrap">
      <input type="range" class="progresso" id="progresso" min="0" max="100" value="0" step="0.1">
      <div class="tempos">
        <span id="tempo-atual">0:00</span>
        <span id="tempo-total">0:00</span>
      </div>
    </div>

    <div class="controles">
      <button id="btn-shuffle" title="Aleatório">🔀</button>
      <button id="btn-prev" title="Anterior">⏮</button>
      <button class="btn-play" id="btn-play" title="Play">▶</button>
      <button id="btn-next" title="Próxima">⏭</button>
      <button id="btn-repeat" title="Repetir: desligado">🔁</button>
    </div>

    <div class="volume-wrap">
      <span style="font-size:0.9rem;color:var(--texto-sec)">🔉</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
      <span style="font-size:0.9rem;color:var(--texto-sec)">🔊</span>
    </div>
  </div>

  <!-- LISTA -->
  <div class="lista-painel">
    <div class="busca-row">
      <input type="text" id="busca" placeholder="🔍 Buscar...">
      <select id="filtro-artista">
        <option value="">🎤 Todos</option>
      </select>
    </div>

    <div class="playlist-tabs" id="playlist-tabs">
      <button class="chip ativo" data-playlist="__all__">Todas</button>
      <button class="chip" data-playlist="❤️ Favoritos">❤️ Favoritos</button>
    </div>

    <div class="lista" id="lista">
      <div class="vazio">
        <div class="emoji">🎵</div>
        <h3>Nenhuma música ainda</h3>
        <p>Clique em <b>📁</b> no topo ou arraste arquivos de música pra cá</p>
        <button id="btn-add-vazio">📁 Escolher músicas</button>
      </div>
    </div>
  </div>

</div>

<!-- Overlay de drag & drop -->
<div class="drop-overlay" id="drop-overlay">
  <div class="emoji">🎵</div>
  <div>Solte as músicas aqui</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-titulo">Nova playlist</h3>
    <input type="text" id="modal-input" placeholder="Nome...">
    <div class="modal-actions">
      <button class="cancelar" id="modal-cancelar">Cancelar</button>
      <button class="confirmar" id="modal-confirmar">OK</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// ============================================================
// ONDAZUL — Player de música em HTML/JS
// ============================================================
(() => {
  'use strict';

  // ============ ESTADO ============
  const state = {
    tracks: [],           // { title, artist, file (File), duration, url }
    viewIndices: [],      // índices visíveis na lista atual
    currentIndex: 0,      // índice dentro de viewIndices
    isPlaying: false,
    shuffle: false,
    repeatMode: 0,        // 0=off, 1=uma, 2=todas
    seeking: false,
    favorites: [],        // array de hashes (title|artist|size)
    playlists: {},        // { nome: [hash1, hash2] }
    currentPlaylist: '__all__',
    searchQuery: '',
    artistFilter: '',
    modalCallback: null,
  };

  // ============ ELEMENTOS ============
  const $ = (id) => document.getElementById(id);
  const audio = $('audio');
  const lista = $('lista');
  const titulo = $('titulo');
  const artista = $('artista');
  const progresso = $('progresso');
  const tempoAtual = $('tempo-atual');
  const tempoTotal = $('tempo-total');
  const btnPlay = $('btn-play');
  const btnPrev = $('btn-prev');
  const btnNext = $('btn-next');
  const btnShuffle = $('btn-shuffle');
  const btnRepeat = $('btn-repeat');
  const btnAdicionar = $('btn-adicionar');
  const btnMenu = $('btn-menu');
  const busca = $('busca');
  const filtroArtista = $('filtro-artista');
  const playlistTabs = $('playlist-tabs');
  const volume = $('volume');
  const dropOverlay = $('drop-overlay');
  const toast = $('toast');
  const modalOverlay = $('modal-overlay');
  const modalTitulo = $('modal-titulo');
  const modalInput = $('modal-input');
  const modalCancelar = $('modal-cancelar');
  const modalConfirmar = $('modal-confirmar');

  // ============ UTILITÁRIOS ============
  const fmt = (s) => {
    if (!s || !isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  };

  const hashTrack = (t) => {
    if (!t.file) return `${t.title}|${t.artist}|${t.size || 0}`;
    return `${t.title}|${t.artist}|${t.file.size}|${t.file.name}`;
  };

  const showToast = (msg) => {
    toast.textContent = msg;
    toast.classList.add('visivel');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('visivel'), 2500);
  };

  // ============ PERSISTÊNCIA ============
  const KEY = 'ondazul_state_v1';

  function saveState() {
    try {
      const data = {
        favorites: state.favorites,
        playlists: state.playlists,
        volume: audio.volume,
        shuffle: state.shuffle,
        repeatMode: state.repeatMode,
      };
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      console.warn('Erro ao salvar:', e);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      state.favorites = data.favorites || [];
      state.playlists = data.playlists || {};
      if (typeof data.volume === 'number') audio.volume = data.volume;
      state.shuffle = !!data.shuffle;
      state.repeatMode = data.repeatMode || 0;
    } catch (e) {
      console.warn('Erro ao carregar:', e);
    }
  }

  // ============ CARREGAR MÚSICAS ============
  function addFiles(files) {
    const validExts = ['mp3', 'ogg', 'wav', 'flac', 'm4a', 'aac', 'opus'];
    let added = 0;

    for (const file of files) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (!validExts.includes(ext)) continue;

      let name = file.name.replace(/\.[^.]+$/, '');
      let artist = 'Desconhecido';
      if (name.includes(' - ')) {
        const parts = name.split(' - ');
        artist = parts[0].trim();
        name = parts.slice(1).join(' - ').trim();
      }

      state.tracks.push({
        title: name,
        artist: artist,
        file: file,
        size: file.size,
        duration: 0,
        url: URL.createObjectURL(file),
      });
      added++;
    }

    if (added > 0) {
      state.tracks.sort((a, b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));
      showToast(`✅ ${added} música(s) adicionada(s)`);
      rebuildPlaylistTabs();
      rebuildArtistFilter();
      applyFilters();
      preloadDurations();
    } else {
      showToast('⚠️ Nenhum arquivo válido');
    }
  }

  function preloadDurations() {
    // Carrega duração em background, uma a uma
    let i = 0;
    const loadNext = () => {
      if (i >= state.tracks.length) return;
      const t = state.tracks[i];
      if (t.duration > 0) { i++; return loadNext(); }

      const a = new Audio();
      a.preload = 'metadata';
      a.src = t.url;
      a.addEventListener('loadedmetadata', () => {
        t.duration = a.duration;
        a.src = '';
        // Atualiza a lista se a música está visível
        renderLista();
        i++;
        setTimeout(loadNext, 50);
      });
      a.addEventListener('error', () => {
        i++;
        setTimeout(loadNext, 50);
      });
    };
    loadNext();
  }

  // ============ VIEW / FILTROS ============
  function applyFilters() {
    const q = state.searchQuery.toLowerCase().trim();
    const artist = state.artistFilter;

    let baseIndices = [];
    if (state.currentPlaylist === '__all__') {
      baseIndices = state.tracks.map((_, i) => i);
    } else {
      // Filtra pela playlist (usa hashes)
      const hashes = new Set(
        (state.playlists[state.currentPlaylist] || []).map(p =>
          typeof p === 'string' ? p : hashTrack(p)
        )
      );
      baseIndices = state.tracks
        .map((t, i) => ({ t, i }))
        .filter(({ t }) => hashes.has(hashTrack(t)))
        .map(({ i }) => i);
    }

    const filtered = [];
    for (const i of baseIndices) {
      const t = state.tracks[i];
      if (artist && t.artist !== artist) continue;
      if (q && !t.title.toLowerCase().includes(q) && !t.artist.toLowerCase().includes(q)) continue;
      filtered.push(i);
    }

    state.viewIndices = filtered;
    if (state.currentIndex >= filtered.length) state.currentIndex = 0;
    renderLista();
    updatePlayerUI();
  }

  function rebuildArtistFilter() {
    const artists = [...new Set(state.tracks.map(t => t.artist))].sort();
    filtroArtista.innerHTML = '<option value="">🎤 Todos</option>' +
      artists.map(a => `<option value="${a}">${a}</option>`).join('');
    filtroArtista.value = state.artistFilter;
  }

  function rebuildPlaylistTabs() {
    playlistTabs.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'chip' + (state.currentPlaylist === '__all__' ? ' ativo' : '');
    allChip.dataset.playlist = '__all__';
    allChip.textContent = 'Todas';
    playlistTabs.appendChild(allChip);

    const favChip = document.createElement('button');
    favChip.className = 'chip' + (state.currentPlaylist === '❤️ Favoritos' ? ' ativo' : '');
    favChip.dataset.playlist = '❤️ Favoritos';
    favChip.textContent = '❤️ Favoritos';
    playlistTabs.appendChild(favChip);

    for (const name of Object.keys(state.playlists)) {
      if (name === '❤️ Favoritos') continue;
      const chip = document.createElement('button');
      chip.className = 'chip' + (state.currentPlaylist === name ? ' ativo' : '');
      chip.dataset.playlist = name;
      chip.textContent = name;
      playlistTabs.appendChild(chip);
    }
  }

  // ============ RENDER LISTA ============
  function renderLista() {
    lista.innerHTML = '';
    if (state.viewIndices.length === 0) {
      const vazio = document.createElement('div');
      vazio.className = 'vazio';
      if (state.tracks.length === 0) {
        vazio.innerHTML = `
          <div class="emoji">🎵</div>
          <h3>Nenhuma música ainda</h3>
          <p>Clique em <b>📁</b> ou arraste arquivos pra cá</p>
        `;
      } else {
        vazio.innerHTML = `
          <div class="emoji">🔍</div>
          <h3>Nada por aqui</h3>
          <p>Nenhuma música corresponde ao filtro</p>
        `;
      }
      lista.appendChild(vazio);
      return;
    }

    const frag = document.createDocumentFragment();
    state.viewIndices.forEach((realIdx, viewIdx) => {
      const t = state.tracks[realIdx];
      const isCurrent = viewIdx === state.currentIndex;
      const isFav = state.favorites.includes(hashTrack(t));

      const item = document.createElement('div');
      item.className = 'item' + (isCurrent ? ' ativo' : '');
      item.dataset.viewIdx = viewIdx;

      item.innerHTML = `
        <span class="item-num">${viewIdx + 1}</span>
        <div class="item-info">
          <div class="item-titulo">${escapeHtml(t.title)}</div>
          <div class="item-artista">${escapeHtml(t.artist)}</div>
        </div>
        <span class="item-dur">${t.duration > 0 ? fmt(t.duration) : ''}</span>
        <div class="item-acoes">
          <button class="btn-fav ${isFav ? 'fav' : ''}" data-action="fav" title="Favoritar">${isFav ? '❤️' : '🤍'}</button>
          <button data-action="rename" title="Renomear">✏️</button>
          <button data-action="add-pl" title="Adicionar a playlist">➕</button>
          ${state.currentPlaylist !== '__all__'
            ? '<button data-action="remove" title="Remover da playlist">🗑️</button>'
            : ''}
        </div>
      `;

      // Click na música
      item.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        playIndex(viewIdx);
      });

      // Click nos botões de ação
      item.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = btn.dataset.action;
          if (action === 'fav') toggleFavorite(t);
          else if (action === 'rename') openRenameModal(t);
          else if (action === 'add-pl') openAddToPlaylistModal(t);
          else if (action === 'remove') removeFromCurrentPlaylist(t);
        });
      });

      frag.appendChild(item);
    });

    lista.appendChild(frag);
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function scrollToCurrent() {
    const item = lista.querySelector('.item.ativo');
    if (item) item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ============ PLAYER ============
  function getCurrentTrack() {
    if (state.viewIndices.length === 0) return null;
    return state.tracks[state.viewIndices[state.currentIndex]];
  }

  function updatePlayerUI() {
    const t = getCurrentTrack();
    if (!t) {
      titulo.textContent = '—';
      artista.textContent = '—';
      tempoTotal.textContent = '0:00';
      tempoAtual.textContent = '0:00';
      progresso.value = 0;
      return;
    }
    titulo.textContent = t.title;
    artista.textContent = t.artist;
    tempoTotal.textContent = t.duration > 0 ? fmt(t.duration) : '0:00';
  }

  function playIndex(viewIdx) {
    if (viewIdx < 0 || viewIdx >= state.viewIndices.length) return;
    state.currentIndex = viewIdx;
    const t = getCurrentTrack();
    if (!t) return;

    audio.src = t.url;
    audio.play().then(() => {
      state.isPlaying = true;
      btnPlay.textContent = '⏸';
      renderLista();
      updatePlayerUI();
      setTimeout(scrollToCurrent, 100);
    }).catch(err => {
      console.warn('Erro ao tocar:', err);
      showToast('⚠️ Não consegui tocar essa música');
    });
  }

  function togglePlay() {
    if (!audio.src) {
      if (state.viewIndices.length === 0) {
        showToast('⚠️ Adicione músicas primeiro');
        return;
      }
      playIndex(state.currentIndex);
      return;
    }

    if (state.isPlaying) {
      audio.pause();
      state.isPlaying = false;
      btnPlay.textContent = '▶';
    } else {
      audio.play();
      state.isPlaying = true;
      btnPlay.textContent = '⏸';
    }
    renderLista();
  }

  function nextTrack() {
    if (state.viewIndices.length === 0) return;

    if (state.shuffle) {
      state.currentIndex = Math.floor(Math.random() * state.viewIndices.length);
    } else {
      state.currentIndex++;
      if (state.currentIndex >= state.viewIndices.length) {
        state.currentIndex = 0;
      }
    }
    playIndex(state.currentIndex);
  }

  function prevTrack() {
    if (state.viewIndices.length === 0) return;

    // Se passou mais de 3s, volta ao início da música
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    state.currentIndex--;
    if (state.currentIndex < 0) state.currentIndex = state.viewIndices.length - 1;
    playIndex(state.currentIndex);
  }

  function onTrackEnd() {
    if (state.repeatMode === 1) {
      // Repetir a mesma
      audio.currentTime = 0;
      audio.play();
    } else {
      // Avança
      const isLast = state.currentIndex >= state.viewIndices.length - 1;
      if (isLast && state.repeatMode === 0) {
        state.isPlaying = false;
        btnPlay.textContent = '▶';
        renderLista();
        return;
      }
      nextTrack();
    }
  }

  // ============ FAVORITOS ============
  function toggleFavorite(t) {
    const h = hashTrack(t);
    const idx = state.favorites.indexOf(h);
    if (idx >= 0) {
      state.favorites.splice(idx, 1);
      showToast('Removido dos favoritos');
    } else {
      state.favorites.push(h);
      showToast('❤️ Adicionado aos favoritos');
    }
    saveState();
    applyFilters();
  }

  // ============ PLAYLISTS ============
  function openRenameModal(t) {
    modalTitulo.textContent = 'Renomear música';
    modalInput.value = t.title;
    modalInput.placeholder = 'Novo título';
    modalOverlay.classList.add('visivel');
    modalInput.focus();

    state.modalCallback = () => {
      const novo = modalInput.value.trim();
      if (!novo) return;
      t.title = novo;
      showToast('✅ Renomeado (só na lista)');
      applyFilters();
    };
  }

  function openAddToPlaylistModal(t) {
    // Cria um modal com a lista de playlists existentes + criar nova
    const nomes = Object.keys(state.playlists).filter(n => n !== '❤️ Favoritos');
    const html = `
      <div style="max-height:150px;overflow-y:auto;margin-bottom:12px;">
        ${nomes.map(n => `<button class="chip" style="margin:4px;display:inline-block;" data-pl="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('') || '<p style="color:var(--texto-mudo);font-size:0.85rem;">Nenhuma playlist ainda</p>'}
      </div>
    `;
    modalTitulo.textContent = `Adicionar: ${t.title}`;
    modalInput.value = '';
    modalInput.placeholder = 'Ou crie uma nova playlist...';

    // Substitui o conteúdo temporariamente
    const overlay = modalOverlay;
    const modal = overlay.querySelector('.modal');
    const originalHTML = modal.querySelector('h3').nextElementSibling;

    const listaDiv = document.createElement('div');
    listaDiv.innerHTML = html;
    modalInput.parentNode.insertBefore(listaDiv, modalInput);

    // Ações nos chips
    listaDiv.querySelectorAll('[data-pl]').forEach(btn => {
      btn.addEventListener('click', () => {
        const nome = btn.dataset.pl;
        addToPlaylist(t, nome);
        closeModal();
        cleanup();
      });
    });

    function cleanup() {
      listaDiv.remove();
      if (originalHTML) originalHTML.style.display = '';
    }

    state.modalCallback = () => {
      const nome = modalInput.value.trim();
      if (!nome) { showToast('⚠️ Digite um nome'); return; }
      if (nome === '❤️ Favoritos') { showToast('⚠️ Nome reservado'); return; }
      addToPlaylist(t, nome);
      cleanup();
    };

    overlay.classList.add('visivel');
    modalInput.focus();
  }

  function addToPlaylist(t, nome) {
    if (!state.playlists[nome]) state.playlists[nome] = [];
    const h = hashTrack(t);
    if (state.playlists[nome].includes(h)) {
      showToast(`Já está em "${nome}"`);
      return;
    }
    state.playlists[nome].push(h);
    saveState();
    rebuildPlaylistTabs();
    showToast(`✅ Adicionado a "${nome}"`);
  }

  function removeFromCurrentPlaylist(t) {
    const nome = state.currentPlaylist;
    if (nome === '__all__') return;
    const h = hashTrack(t);
    if (state.playlists[nome]) {
      state.playlists[nome] = state.playlists[nome].filter(x => x !== h);
      saveState();
      showToast(`🗑️ Removido de "${nome}"`);
      applyFilters();
    }
  }

  function createPlaylist() {
    modalTitulo.textContent = 'Nova playlist';
    modalInput.value = '';
    modalInput.placeholder = 'Nome da playlist';
    modalOverlay.classList.add('visivel');
    modalInput.focus();

    state.modalCallback = () => {
      const nome = modalInput.value.trim();
      if (!nome) return;
      if (nome === '❤️ Favoritos') { showToast('⚠️ Nome reservado'); return; }
      if (state.playlists[nome]) { showToast('⚠️ Já existe'); return; }
      state.playlists[nome] = [];
      saveState();
      rebuildPlaylistTabs();
      showToast(`✅ Playlist "${nome}" criada`);
    };
  }

  function closeModal() {
    modalOverlay.classList.remove('visivel');
    state.modalCallback = null;
  }

  // ============ EVENTOS ============
  btnPlay.addEventListener('click', togglePlay);
  btnNext.addEventListener('click', nextTrack);
  btnPrev.addEventListener('click', prevTrack);

  btnShuffle.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    btnShuffle.classList.toggle('ativo', state.shuffle);
    saveState();
    showToast(state.shuffle ? '🔀 Aleatório ativado' : '🔀 Aleatório desativado');
  });

  btnRepeat.addEventListener('click', () => {
    state.repeatMode = (state.repeatMode + 1) % 3;
    btnRepeat.classList.remove('ativo');
    if (state.repeatMode === 1) {
      btnRepeat.textContent = '🔂';
      btnRepeat.title = 'Repetir: uma música';
      btnRepeat.classList.add('ativo');
    } else if (state.repeatMode === 2) {
      btnRepeat.textContent = '🔁';
      btnRepeat.title = 'Repetir: todas';
      btnRepeat.classList.add('ativo');
    } else {
      btnRepeat.textContent = '🔁';
      btnRepeat.title = 'Repetir: desligado';
    }
    saveState();
  });

  btnAdicionar.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*';
    input.multiple = true;
    input.addEventListener('change', (e) => {
      addFiles(e.target.files);
    });
    input.click();
  });

  btnMenu.addEventListener('click', () => {
    const opcao = prompt('Escolha uma opção:\n1 - Nova playlist\n2 - Limpar todas as músicas\n3 - Limpar favoritos e playlists');
    if (opcao === '1') createPlaylist();
    else if (opcao === '2') {
      if (confirm('Remover todas as músicas da lista?')) {
        state.tracks = [];
        state.viewIndices = [];
        state.currentIndex = 0;
        audio.pause();
        audio.src = '';
        state.isPlaying = false;
        btnPlay.textContent = '▶';
        rebuildArtistFilter();
        applyFilters();
        updatePlayerUI();
      }
    }
    else if (opcao === '3') {
      if (confirm('Apagar favoritos e playlists?')) {
        state.favorites = [];
        state.playlists = {};
        saveState();
        rebuildPlaylistTabs();
        applyFilters();
      }
    }
  });

  // Volume
  volume.addEventListener('input', () => {
    audio.volume = parseFloat(volume.value);
    saveState();
  });

  // Busca
  busca.addEventListener('input', () => {
    state.searchQuery = busca.value;
    applyFilters();
  });

  // Filtro artista
  filtroArtista.addEventListener('change', () => {
    state.artistFilter = filtroArtista.value;
    applyFilters();
  });

  // Tabs de playlist
  playlistTabs.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.currentPlaylist = chip.dataset.playlist;
    state.currentIndex = 0;
    rebuildPlaylistTabs();
    applyFilters();
  });

  // Áudio
  audio.addEventListener('timeupdate', () => {
    if (state.seeking) return;
    if (audio.duration > 0) {
      progresso.value = (audio.currentTime / audio.duration) * 100;
    }
    tempoAtual.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    tempoTotal.textContent = fmt(audio.duration);
    const t = getCurrentTrack();
    if (t && t.duration === 0) t.duration = audio.duration;
  });

  audio.addEventListener('play', () => {
    state.isPlaying = true;
    btnPlay.textContent = '⏸';
  });

  audio.addEventListener('pause', () => {
    state.isPlaying = false;
    btnPlay.textContent = '▶';
  });

  audio.addEventListener('ended', onTrackEnd);

  // Progresso — seek
  progresso.addEventListener('input', () => {
    state.seeking = true;
    if (audio.duration > 0) {
      const tempo = (progresso.value / 100) * audio.duration;
      tempoAtual.textContent = fmt(tempo);
    }
  });

  progresso.addEventListener('change', () => {
    if (audio.duration > 0) {
      audio.currentTime = (progresso.value / 100) * audio.duration;
    }
    state.seeking = false;
  });

  // Modal
  modalCancelar.addEventListener('click', closeModal);
  modalConfirmar.addEventListener('click', () => {
    if (state.modalCallback) state.modalCallback();
    closeModal();
  });
  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (state.modalCallback) state.modalCallback();
      closeModal();
    }
    if (e.key === 'Escape') closeModal();
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  // Drag & drop
  let dragCounter = 0;
  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('visivel');
  });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dropOverlay.classList.remove('visivel');
      dragCounter = 0;
    }
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('visivel');
    if (e.dataTransfer.files.length > 0) {
      addFiles(e.dataTransfer.files);
    }
  });

  // Atalhos de teclado
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight') nextTrack();
    else if (e.code === 'ArrowLeft') prevTrack();
  });

  // ============ INICIALIZAÇÃO ============
  function init() {
    loadState();
    // Aplica estado carregado nos botões
    btnShuffle.classList.toggle('ativo', state.shuffle);
    volume.value = audio.volume;
    // Repeat
    if (state.repeatMode === 1) {
      btnRepeat.textContent = '🔂';
      btnRepeat.classList.add('ativo');
    } else if (state.repeatMode === 2) {
      btnRepeat.classList.add('ativo');
    }
    updatePlayerUI();
  }

  init();
})();
</script>

</body>
</html>
